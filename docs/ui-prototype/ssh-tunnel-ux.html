<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proxy Pilot · SSH 隧道交互优化预览 (v0.1.1-rc.45)</title>
  <style>
    :root {
      --bg-canvas: #F1F4F9;
      --bg-surface: #FFFFFF;
      --bg-panel-alt: #F8FAFD;
      --bg-chip: #EEF3FB;
      --bg-proto: #E7EEF9;
      --accent: #1D6FE8;
      --accent-hover: #175EC7;
      --accent-soft: rgba(29, 111, 232, 0.10);
      --border: #DFE5EF;
      --border-strong: #C5D0E0;
      --ink: #17202E;
      --ink-weak: #5B6678;
      --success: #15803D;
      --success-soft: rgba(21, 128, 61, 0.11);
      --warn: #B45309;
      --warn-soft: rgba(180, 83, 9, 0.11);
      --danger: #B91C1C;
      --danger-soft: rgba(185, 28, 28, 0.10);
      --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-modal: 0 18px 42px rgba(15, 23, 42, 0.22);
      --ctrl-h: 36px;
      --r-ctrl: 8px;
      --r-seg: 7px;
      --r-card: 10px;
      --r-modal: 12px;
      --r-pill: 999px;
      --font-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    [data-theme="dark"] {
      --bg-canvas: #0F151E;
      --bg-surface: #18202C;
      --bg-panel-alt: #1E2837;
      --bg-chip: #253244;
      --bg-proto: #131B26;
      --accent: #4D97FF;
      --accent-hover: #6BA9FF;
      --accent-soft: rgba(77, 151, 255, 0.15);
      --border: #2B3749;
      --border-strong: #3C4C63;
      --ink: #E7EDF6;
      --ink-weak: #9AA7BA;
      --success: #4ADE80;
      --success-soft: rgba(74, 222, 128, 0.14);
      --warn: #FBBF24;
      --warn-soft: rgba(251, 191, 36, 0.14);
      --danger: #F87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.28);
      --shadow-modal: 0 20px 48px rgba(0, 0, 0, 0.56);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-canvas);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .weak {
      color: var(--ink-weak);
    }

    /* Prototype Toolbar */
    .proto-bar {
      background: var(--bg-proto);
      border-bottom: 1px solid var(--border-strong);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .proto-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .proto-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 9px;
      border-radius: var(--r-pill);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(29, 111, 232, 0.25);
    }

    .proto-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
    }

    .proto-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .proto-label {
      font-size: 12px;
      color: var(--ink-weak);
    }

    /* Controls: 36px height, 8px radius, 1px solid strong border */
    .btn, .input, .select {
      height: var(--ctrl-h);
      border-radius: var(--r-ctrl);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink);
      transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, opacity 0.14s ease;
    }

    .input, .select {
      padding: 0 11px;
      outline: none;
      width: 100%;
    }

    .select.inline-select {
      width: auto;
      min-width: 196px;
    }

    .input:focus, .select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .input[readonly] {
      background: var(--bg-panel-alt);
      color: var(--ink-weak);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-panel-alt);
      border-color: var(--accent);
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #FFFFFF;
    }

    .btn-danger {
      color: var(--danger);
      border-color: rgba(185, 28, 28, 0.35);
      background: var(--bg-surface);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .btn-success {
      color: var(--success);
      border-color: rgba(21, 128, 61, 0.38);
      background: var(--bg-surface);
    }

    .btn-success:hover:not(:disabled) {
      background: var(--success-soft);
      border-color: var(--success);
    }

    .btn-sm {
      height: 30px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-xs {
      height: 26px;
      padding: 0 8px;
      font-size: 11.5px;
      border-radius: 6px;
    }

    .btn-4c {
      min-width: 84px;
    }

    /* Segmented Controls */
    .seg {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: var(--r-ctrl);
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-strong);
      gap: 3px;
    }

    .seg-btn {
      height: 28px;
      padding: 0 12px;
      border: none;
      border-radius: var(--r-seg);
      background: transparent;
      color: var(--ink-weak);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.14s ease, color 0.14s ease;
    }

    .seg-btn:hover:not(:disabled):not(.active) {
      color: var(--ink);
      background: var(--bg-chip);
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .seg-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* App Shell */
    .app-shell {
      max-width: 1220px;
      margin: 14px auto 24px;
      padding: 0 16px;
    }

    .app-window {
      background: var(--bg-canvas);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      min-height: 700px;
    }

    /* Top Bar */
    .app-topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-soft);
      flex-shrink: 0;
    }

    .status-dot.stopped {
      background: var(--warn);
      box-shadow: 0 0 0 3px var(--warn-soft);
    }

    .status-dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 3px var(--danger-soft);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--r-pill);
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .pill-neutral {
      background: var(--bg-panel-alt);
      border-color: var(--border);
      color: var(--ink-weak);
    }

    .pill-accent {
      background: var(--accent-soft);
      border-color: rgba(29, 111, 232, 0.25);
      color: var(--accent);
    }

    .pill-success {
      background: var(--success-soft);
      border-color: rgba(21, 128, 61, 0.25);
      color: var(--success);
    }

    .pill-warn {
      background: var(--warn-soft);
      border-color: rgba(180, 83, 9, 0.28);
      color: var(--warn);
    }

    .pill-danger {
      background: var(--danger-soft);
      border-color: rgba(185, 28, 28, 0.28);
      color: var(--danger);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .nav-tab {
      height: 32px;
      padding: 0 13px;
      border-radius: var(--r-ctrl);
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-weak);
      font-weight: 500;
      cursor: pointer;
    }

    .nav-tab:hover {
      background: var(--bg-panel-alt);
      color: var(--ink);
    }

    .nav-tab.active {
      background: var(--accent-soft);
      border-color: rgba(29, 111, 232, 0.28);
      color: var(--accent);
      font-weight: 600;
    }

    .version-label {
      font-size: 12px;
      color: var(--ink-weak);
      font-family: var(--font-mono);
    }

    /* Main Workspace */
    .app-main {
      flex: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 16px;
      box-shadow: var(--shadow-card);
    }

    .subcard {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 13px 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      margin: 0;
    }

    /* Overview Grid */
    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1.18fr;
      gap: 14px;
      align-items: start;
    }

    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .kv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }

    .kv-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .kv-key {
      color: var(--ink-weak);
      font-size: 12.5px;
    }

    .kv-val {
      font-weight: 600;
      text-align: right;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .overview-subsection {
      margin-top: 12px;
    }

    .overview-subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .overview-subhead-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-weak);
    }

    .compact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .compact-row {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .compact-row-main {
      min-width: 0;
      flex: 1 1 240px;
    }

    .compact-row-title {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .compact-row-route {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-weak);
      margin-top: 3px;
      word-break: break-all;
    }

    .compact-row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Config Split Layout */
    .config-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      align-items: start;
    }

    .profile-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .profile-item {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--bg-panel-alt);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .profile-item-name {
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .config-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .config-tab {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--r-ctrl);
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-weak);
      font-weight: 500;
      cursor: pointer;
    }

    .config-tab.active {
      background: var(--bg-panel-alt);
      border-color: var(--border-strong);
      color: var(--ink);
      font-weight: 700;
    }

    .subtabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .subtab {
      height: 32px;
      padding: 0 13px;
      border-radius: var(--r-ctrl);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink-weak);
      font-weight: 600;
      cursor: pointer;
    }

    .subtab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    /* Summary & Section Cards */
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .summary-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .block-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .block-section:last-child {
      margin-bottom: 0;
    }

    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entity-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entity-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-card);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entity-card.running {
      border-color: rgba(21, 128, 61, 0.45);
    }

    [data-theme="dark"] .entity-card.running {
      border-color: rgba(74, 222, 128, 0.40);
    }

    .entity-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entity-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .entity-title {
      font-size: 14px;
      font-weight: 700;
    }

    .entity-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Flow Strip */
    .flow-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 9px 11px;
      border-radius: 8px;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .flow-node {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    .flow-node.hop {
      background: var(--accent-soft);
      border-color: rgba(29, 111, 232, 0.25);
      color: var(--accent);
      font-family: var(--font-sans);
    }

    .flow-arrow {
      color: var(--ink-weak);
      font-weight: 700;
    }

    /* Banners */
    .banner {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .banner-warn {
      background: var(--warn-soft);
      border-color: rgba(180, 83, 9, 0.30);
      color: var(--warn);
    }

    .banner-danger {
      background: var(--danger-soft);
      border-color: rgba(185, 28, 28, 0.30);
      color: var(--danger);
    }

    .banner-success {
      background: var(--success-soft);
      border-color: rgba(21, 128, 61, 0.28);
      color: var(--success);
    }

    .banner-info {
      background: var(--accent-soft);
      border-color: rgba(29, 111, 232, 0.26);
      color: var(--accent);
    }

    /* Empty State */
    .empty-box {
      border: 1px dashed var(--border-strong);
      background: var(--bg-panel-alt);
      border-radius: var(--r-card);
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .empty-title {
      font-weight: 700;
      font-size: 13.5px;
    }

    .empty-desc {
      color: var(--ink-weak);
      max-width: 520px;
      font-size: 12.5px;
    }

    /* Bottom Status Strip */
    .status-strip {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-weak);
    }

    .status-strip-left, .status-strip-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 16, 26, 0.56);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-card {
      width: 100%;
      max-width: 670px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-modal);
      padding: 20px 16px;
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-card.wide {
      max-width: 720px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .modal-foot-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field-hint {
      font-size: 12px;
      color: var(--ink-weak);
    }

    .row-flex {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-target {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 10px;
    }

    .grid-listen {
      display: grid;
      grid-template-columns: 1.35fr 0.9fr auto;
      gap: 8px;
      align-items: end;
    }

    .chip-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      height: 27px;
      padding: 0 9px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border-strong);
      background: var(--bg-panel-alt);
      color: var(--ink-weak);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .check-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .inline-cred-box {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Toast */
    .toast-host {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: min(420px, calc(100vw - 36px));
    }

    .toast {
      background: var(--ink);
      color: var(--bg-surface);
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: var(--shadow-modal);
      pointer-events: auto;
    }

    .toast.success {
      background: var(--success);
      color: #FFFFFF;
    }

    .toast.warn {
      background: var(--warn);
      color: #FFFFFF;
    }

    .toast.danger {
      background: var(--danger);
      color: #FFFFFF;
    }

    /* Highlights List */
    .highlights-list {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .highlights-list li {
      line-height: 1.5;
    }

    /* Responsive Breakpoints (1100px & 760px, zero horizontal overflow) */
    @media (max-width: 1100px) {
      .overview-grid {
        grid-template-columns: 1fr;
      }
      .config-layout {
        grid-template-columns: 190px 1fr;
      }

    @media (max-width: 760px) {
      .app-shell {
        padding: 0 8px;

      }
      .app-topbar {
        padding: 10px 12px;
      }
      .select.inline-select {
        min-width: 0;
        width: 100%;
      }
    }
  </style>

<body>

    </div>

  <!-- Main Simulated App -->
  <main class="app-shell">
    <section class="app-window" aria-label="Proxy Pilot 模拟窗口">
      <div id="appTopBar"></div>
      <div id="appMain" class="app-main"></div>
      <div id="appStatusStrip"></div>
    </section>
  </main>

  <div id="modalRoot"></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      function esc(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function cloneData(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      var COMMON_TARGET_PORTS = [
        { port: 22, label: "SSH", short: "22 SSH" },
        { port: 3306, label: "MySQL", short: "3306 MySQL" },
        { port: 5432, label: "PG", short: "5432 PG" },
        { port: 6379, label: "Redis", short: "6379 Redis" },
        { port: 8080, label: "Web", short: "8080 Web" },
        { port: 3389, label: "RDP", short: "3389 RDP" }
      ];

      function inferServiceLabel(port) {
        var p = Number(port);
        for (var i = 0; i < COMMON_TARGET_PORTS.length; i++) {
          if (COMMON_TARGET_PORTS[i].port === p) {
            return COMMON_TARGET_PORTS[i].label;
          }
        }
        return "";
      }

      function buildAutoTunnelName(targetHost, targetPort) {
        var host = (targetHost || "").trim() || "127.0.0.1";
        var port = Number(targetPort) || 0;
        var svc = inferServiceLabel(port);
        if (svc && port > 0) {
          return svc + " (" + host + ":" + port + ")";
        }
        if (port > 0) {
          return host + ":" + port;
        }
        return host;
      }

      function buildAutoCredName(username, authKind) {
        var u = (username || "").trim() || "user";
        return u + " · " + (authKind === "private_key" ? "私钥" : "密码");
      }

      function createScenarioData(kind) {
        if (kind === "first") {
          return {
            scenario: "first",
            coreRunning: true,
            proxyMode: "pac",
            activeProfileId: "prod",
            brokenXrayJson: false,
            activeNav: "config",
            activeConfigTab: "forwards",
            activeForwardSubtab: "rules",
            nextId: 100,
            xrayForwards: [
              {
                id: "xf-1",
                name: "内部测试站代理转发",
                protocol: "tcp",
                listenIp: "127.0.0.1",
                listenPort: 18080,
                targetHost: "10.20.0.15",
                targetPort: 80,
                outboundTag: "proxy-sg-01"
              }
            ],
            sshCredentials: [],
            sshHosts: [],
            sshForwards: []
          };
        }

        if (kind === "broken_json") {
          var base = createScenarioData("daily");
          base.scenario = "broken_json";
          base.coreRunning = false;
          base.brokenXrayJson = true;
          base.activeNav = "config";
          base.activeConfigTab = "forwards";
          base.activeForwardSubtab = "rules";
          base.sshForwards[0].state = "running";
          return base;
        }

        return {
          scenario: "daily",
          coreRunning: true,
          proxyMode: "pac",
          activeProfileId: "prod",
          brokenXrayJson: false,
          activeNav: "overview",
          activeConfigTab: "forwards",
          activeForwardSubtab: "rules",
          nextId: 100,
          xrayForwards: [
            {
              id: "xf-1",
              name: "海外 API 出口映射",
              protocol: "tcp",
              listenIp: "127.0.0.1",
              listenPort: 18443,
              targetHost: "api.partner.internal",
              targetPort: 443,
              outboundTag: "proxy-sg-01"
            }
          ],
          sshCredentials: [
            {
              id: "cred-1",
              name: "ops 运维私钥",
              username: "ops",
              authKind: "private_key",
              keyPath: "C:\\Users\\demo\\.ssh\\id_ed25519_ops",
              hasPassphrase: true,
              dpapiEncrypted: true
            },
            {
              id: "cred-2",
              name: "readonly 账号密码",
              username: "readonly",
              authKind: "password",
              keyPath: "",
              hasPassphrase: false,
              dpapiEncrypted: true
            }
          ],
          sshHosts: [
            {
              id: "host-1",
              name: "生产跳板机 · 华东",
              address: "bastion-hz.corp.example",
              port: 2222,
              credentialId: "cred-1",
              fingerprint: "SHA256:8Kp3mYv1qZ7rN4xL0wC9dT2bF6hJ5sA3eM8uG1pQ4",
              lastTestStatus: "ok",
              lastTestMsg: "握手成功 (RTT 24 ms)"
            },
            {
              id: "host-2",
              name: "预发堡垒机",
              address: "192.168.50.10",
              port: 22,
              credentialId: "cred-2",
              fingerprint: "",
              lastTestStatus: "",
              lastTestMsg: ""
            }
          ],
          sshForwards: [
            {
              id: "sf-1",
              name: "PG (10.0.1.8:5432)",
              sshHostId: "host-1",
              listenScope: "loopback",
              listenIp: "127.0.0.1",
              listenPort: 15432,
              targetHost: "10.0.1.8",
              targetPort: 5432,
              state: "running",
              lastError: ""
            },
            {
              id: "sf-2",
              name: "Redis (10.0.1.12:6379)",
              sshHostId: "host-1",
              listenScope: "loopback",
              listenIp: "127.0.0.1",
              listenPort: 16379,
              targetHost: "10.0.1.12",
              targetPort: 6379,
              state: "stopped",
              lastError: ""
            },
            {
              id: "sf-3",
              name: "MySQL (10.0.2.21:3306)",
              sshHostId: "host-2",
              listenScope: "lan",
              listenIp: "0.0.0.0",
              listenPort: 13306,
              targetHost: "10.0.2.21",
              targetPort: 3306,
              state: "stopped",
              lastError: ""
            }
          ]
        };
      }

      var state = createScenarioData("daily");
      var theme = "light";
      var modalStack = [];
      var toastTimer = null;

      function nextUid(prefix) {
        state.nextId += 1;
        return prefix + "-" + state.nextId;
      }

      function getHostById(id) {
        for (var i = 0; i < state.sshHosts.length; i++) {
          if (state.sshHosts[i].id === id) return state.sshHosts[i];
        }
        return null;
      }

      function getCredById(id) {
        for (var i = 0; i < state.sshCredentials.length; i++) {
          if (state.sshCredentials[i].id === id) return state.sshCredentials[i];
        }
        return null;
      }

      function getForwardById(id) {
        for (var i = 0; i < state.sshForwards.length; i++) {
          if (state.sshForwards[i].id === id) return state.sshForwards[i];
        }
        return null;
      }

      function countHostRefs(hostId) {
        var n = 0;
        for (var i = 0; i < state.sshForwards.length; i++) {
          if (state.sshForwards[i].sshHostId === hostId) n += 1;
        }
        return n;
      }

      function countCredRefs(credId) {
        var n = 0;
        for (var i = 0; i < state.sshHosts.length; i++) {
          if (state.sshHosts[i].credentialId === credId) n += 1;
        }
        return n;
      }

      function isLoopbackIp(ip) {
        var v = (ip || "").trim();
        return v === "127.0.0.1" || v === "::1" || v === "localhost";
      }

      function isLanExposed(fwd) {
        return fwd.listenScope !== "loopback" && !isLoopbackIp(fwd.listenIp);
      }

      function getCopyAddress(fwd) {
        var ip = (fwd.listenIp || "").trim();
        if (!ip || ip === "0.0.0.0" || ip === "::" || ip === "127.0.0.1") {
          return "127.0.0.1:" + fwd.listenPort;
        }
        return ip + ":" + fwd.listenPort;
      }

      function getUsedLocalPorts(excludeId, excludeKind) {
        var used = [];
        for (var i = 0; i < state.sshForwards.length; i++) {
          var sf = state.sshForwards[i];
          if (excludeKind === "ssh" && sf.id === excludeId) continue;
          used.push({ port: Number(sf.listenPort), source: "SSH 隧道「" + sf.name + "」" });
        }
        for (var j = 0; j < state.xrayForwards.length; j++) {
          var xf = state.xrayForwards[j];
          if (excludeKind === "xray" && xf.id === excludeId) continue;
          used.push({ port: Number(xf.listenPort), source: "Xray 转发「" + xf.name + "」" });
        }
        return used;
      }

      function findPortConflict(port, excludeId, excludeKind) {
        var p = Number(port);
        if (!p || p < 1 || p > 65535) return null;
        var used = getUsedLocalPorts(excludeId, excludeKind);
        for (var i = 0; i < used.length; i++) {
          if (used[i].port === p) return used[i];
        }
        return null;
      }

      function findNextFreePort(preferredStart, excludeId, excludeKind) {
        var usedSet = {};
        var used = getUsedLocalPorts(excludeId, excludeKind);
        for (var i = 0; i < used.length; i++) {
          usedSet[used[i].port] = true;
        }
        var p = Number(preferredStart) || 15000;
        if (p < 1024) p = p + 10000;
        if (p > 65000) p = 15000;
        while (usedSet[p] && p < 65535) {
          p += 1;
        }
        if (usedSet[p]) {
          p = 15001;
          while (usedSet[p] && p < 65535) p += 1;
        }
        return p;
      }

      function showToast(message, kind) {
        var host = document.getElementById("toastHost");
        if (!host) return;
        host.innerHTML = '<div class="toast ' + esc(kind || "") + '">' + esc(message) + "</div>";
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          host.innerHTML = "";
        }, 2800);
      }

      function copyTextToClipboard(text, okMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast(okMsg || ("已复制：" + text), "success");
          }, function () {
            fallbackCopy(text, okMsg);
          });
        } else {
          fallbackCopy(text, okMsg);
        }
      }

      function fallbackCopy(text, okMsg) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(okMsg || ("已复制：" + text), "success");
        } catch (e) {
          showToast("复制失败，请手动复制：" + text, "warn");
        }
      }

      function splitHostPort(raw) {
        var text = (raw || "").trim();
        var user = "";
        var host = text;
        var port = "";
        var atIdx = text.indexOf("@");
        if (atIdx > 0) {
          user = text.slice(0, atIdx).trim();
          host = text.slice(atIdx + 1).trim();
        }
        var m = host.match(/^\[([^\]]+)\]:(\d{1,5})$/);
        if (m) {
          return { user: user, host: m[1], port: Number(m[2]) };
        }
        var colonCount = (host.match(/:/g) || []).length;
        if (colonCount === 1) {
          var idx = host.lastIndexOf(":");
          var pStr = host.slice(idx + 1).trim();
          if (/^\d{1,5}$/.test(pStr)) {
            var pNum = Number(pStr);
            if (pNum >= 1 && pNum <= 65535) {
              return { user: user, host: host.slice(0, idx).trim(), port: pNum };
            }
          }
        }
        return { user: user, host: host, port: port };
      }

      function parseSshLCommand(cmdText) {
        var raw = (cmdText || "").trim();
        if (!raw) {
          return { ok: false, error: "请先粘贴 ssh -L 命令" };
        }
        var tokens = raw.match(/"[^"]*"|'[^']*'|\S+/g) || [];
        var cleanTokens = tokens.map(function (t) {
          return t.replace(/^['"]|['"]$/g, "");
        });

        var lSpec = "";
        var sshPort = 22;
        var user = "";
        var jumpHost = "";

        for (var i = 0; i < cleanTokens.length; i++) {
          var tok = cleanTokens[i];
          if (tok === "ssh") continue;
          if (tok === "-L" && i + 1 < cleanTokens.length) {
            lSpec = cleanTokens[++i];
            continue;
          }
          if (tok.indexOf("-L") === 0 && tok.length > 2) {
            lSpec = tok.slice(2);
            continue;
          }
          if (tok === "-p" && i + 1 < cleanTokens.length) {
            var pVal = Number(cleanTokens[++i]);
            if (pVal >= 1 && pVal <= 65535) sshPort = pVal;
            continue;
          }
          if (tok.indexOf("-p") === 0 && /^\d+$/.test(tok.slice(2))) {
            var pInline = Number(tok.slice(2));
            if (pInline >= 1 && pInline <= 65535) sshPort = pInline;
            continue;
          }
          if (tok === "-i" || tok === "-F" || tok === "-o" || tok === "-J" || tok === "-l") {
            if (tok === "-l" && i + 1 < cleanTokens.length) {
              user = cleanTokens[++i];
            } else if (i + 1 < cleanTokens.length) {
              i += 1;
            }
            continue;
          }
          if (tok.charAt(0) === "-") continue;
          if (tok.indexOf("@") !== -1) {
            var parts = tok.split("@");
            user = parts[0] || user;
            jumpHost = parts.slice(1).join("@");
          } else if (!jumpHost && tok.indexOf(":") === -1) {
            jumpHost = tok;
          }
        }

        if (!lSpec) {
          return { ok: false, error: "未检测到 -L 本地转发参数（格式示例：-L 15432:10.0.1.8:5432）" };
        }

        var partsL = lSpec.split(":");
        var listenIp = "127.0.0.1";
        var listenPort = 0;
        var targetHost = "";
        var targetPort = 0;

        if (partsL.length === 3) {
          listenPort = Number(partsL[0]);
          targetHost = partsL[1];
          targetPort = Number(partsL[2]);
        } else if (partsL.length === 4) {
          listenIp = partsL[0] || "127.0.0.1";
          listenPort = Number(partsL[1]);
          targetHost = partsL[2];
          targetPort = Number(partsL[3]);
        } else {
          return { ok: false, error: "-L 参数段数异常，应为 [绑定IP:]本地端口:目标主机:目标端口" };
        }

        if (!listenPort || listenPort < 1 || listenPort > 65535 || !targetHost || !targetPort || targetPort < 1 || targetPort > 65535) {
          return { ok: false, error: "-L 中的端口号或目标主机无效" };
        }

        var matchedHost = null;
        if (jumpHost) {
          for (var h = 0; h < state.sshHosts.length; h++) {
            var cand = state.sshHosts[h];
            if (cand.address.toLowerCase() === jumpHost.toLowerCase() && Number(cand.port) === Number(sshPort)) {
              matchedHost = cand;
              break;
            }
          }
          if (!matchedHost) {
            for (var h2 = 0; h2 < state.sshHosts.length; h2++) {
              if (state.sshHosts[h2].address.toLowerCase() === jumpHost.toLowerCase()) {
                matchedHost = state.sshHosts[h2];
                break;
              }
            }
          }
        }

        return {
          ok: true,
          listenIp: listenIp,
          listenPort: listenPort,
          targetHost: targetHost,
          targetPort: targetPort,
          user: user,
          jumpHost: jumpHost,
          sshPort: sshPort,
          matchedHost: matchedHost
        };
      }

      /* ---------------- Tunnel & Host Async Actions ---------------- */
      function toggleTunnelState(fwdId) {
        var fwd = getForwardById(fwdId);
        if (!fwd) return;
        if (fwd.state === "running") {
          fwd.state = "stopped";
          fwd.lastError = "";
          renderApp();
          showToast("已停止 SSH 隧道「" + fwd.name + "」");
          return;
        }
        if (fwd.state === "connecting") return;

        var host = getHostById(fwd.sshHostId);
        if (!host) {
          fwd.state = "stopped";
          fwd.lastError = "关联的 SSH 跳板机不存在";
          renderApp();
          showToast(fwd.lastError, "danger");
          return;
        }
        fwd.state = "connecting";
        fwd.lastError = "";
        renderApp();
        setTimeout(function () {
          var target = getForwardById(fwdId);
          if (!target || target.state !== "connecting") return;
          if (!host.fingerprint) {
            target.state = "stopped";
            target.lastError = "跳板机「" + host.name + "」尚未固定服务器指纹，请先在 SSH 跳板机中探测指纹";
            renderApp();
            showToast(target.lastError, "warn");
            return;
          }
          target.state = "running";
          target.lastError = "";
          renderApp();
          showToast("SSH 隧道「" + target.name + "」已就绪，监听 " + getCopyAddress(target), "success");
        }, 350);
      }

      function startAllTunnels() {
        var pending = [];
        for (var i = 0; i < state.sshForwards.length; i++) {
          var fwd = state.sshForwards[i];
          if (fwd.state !== "running" && fwd.state !== "connecting") {
            fwd.state = "connecting";
            fwd.lastError = "";
            pending.push(fwd.id);
          }
        }
        if (!pending.length) {
          showToast("全部 SSH 隧道已在运行中");
          return;
        }
        renderApp();
        setTimeout(function () {
          var started = 0;
          var blocked = 0;
          for (var j = 0; j < pending.length; j++) {
            var item = getForwardById(pending[j]);
            if (!item || item.state !== "connecting") continue;
            var host = getHostById(item.sshHostId);
            if (!host || !host.fingerprint) {
              item.state = "stopped";
              item.lastError = "跳板机缺少服务器指纹验证";
              blocked += 1;
            } else {
              item.state = "running";
              item.lastError = "";
              started += 1;
            }
          }
          renderApp();
          if (blocked > 0) {
            showToast("已启动 " + started + " 条隧道，" + blocked + " 条因跳板机未验证指纹未启动", "warn");

            state.sshForwards[i].lastError = "";
            stopped += 1;
          }

        renderApp();
        showToast(stopped ? ("已停止 " + stopped + " 条 SSH 隧道") : "当前没有运行中的 SSH 隧道");

      function testHostConnection(hostId) {
        var host = getHostById(hostId);
        if (!host) return;
        host.lastTestStatus = "testing";
        host.lastTestMsg = "正在模拟 SSH 握手与认证检查…";
        renderApp();
        setTimeout(function () {
          var h = getHostById(hostId);
          if (!h) return;
          if (!h.fingerprint) {
            h.lastTestStatus = "error";
            h.lastTestMsg = "连接受阻：尚未固定服务器 SHA256 指纹（请点“编辑”探测指纹）。";
            renderApp();
            showToast("跳板机「" + h.name + "」未验证指纹", "warn");
            return;
          }
          var cred = getCredById(h.credentialId);
          if (!cred) {
            h.lastTestStatus = "error";
            h.lastTestMsg = "连接受阻：未绑定 SSH 登录凭证。";
            renderApp();
            showToast("跳板机未绑定凭证", "danger");
            return;
          }
          var rtt = 18 + (hostId.length * 7) % 29;
          h.lastTestStatus = "ok";
          h.lastTestMsg = "握手与身份校验通过（账号 " + cred.username + "，RTT " + rtt + " ms）";
          renderApp();
          showToast("跳板机「" + h.name + "」测试连接成功", "success");
        }, 450);
      }

      function updatePortForwardLiveHints() {
        var m = modalStack[modalStack.length - 1];

              : "";

          var conflictBox = document.getElementById("pfLivePortConflict");

        } else if (top.type === "ssh_cred") {
          inner = renderSshCredModalHtml(top);
        } else if (top.type === "highlights") {
          inner = renderHighlightsModalHtml();
        }
        root.innerHTML = '<div class="modal-backdrop" data-backdrop-close>' + inner + "</div>";
        if (top.type === "port_forward") {
          updatePortForwardLiveHints();
        } else if (top.type === "ssh_host") {
          updateSshHostLiveHints();
        }
      }

      /* ---------------- Save Handlers ---------------- */
      function savePortForwardModal() {
        var m = modalStack[modalStack.length - 1];
        if (!m || m.type !== "port_forward") return;
        m.errorMsg = "";

        if (m.mode === "ssh") {
          var hostId = m.ssh.sshHostId;
          var targetHost = (m.ssh.targetHost || "").trim();
          var targetPort = Number(m.ssh.targetPort);
          var listenIp = (m.ssh.listenIp || "").trim() || "127.0.0.1";
          var listenPort = Number(m.ssh.listenPort);

          if (!hostId || !getHostById(hostId)) {
            m.errorMsg = "请先选择或新建一台 SSH 跳板机。";
          } else if (!targetHost) {
            m.errorMsg = "请填写目标地址（例如 10.0.1.8 或 127.0.0.1）。";
          } else if (!targetPort || targetPort < 1 || targetPort > 65535) {
            m.errorMsg = "目标端口必须在 1 ~ 65535 之间。";
          } else if (!listenPort || listenPort < 1 || listenPort > 65535) {
            m.errorMsg = "本机监听端口必须在 1 ~ 65535 之间。";
          } else if (findPortConflict(listenPort, m.editSshId, "ssh")) {
            m.errorMsg = "本机端口 " + listenPort + " 已被其他转发规则占用，请修改或点击上方「改用空闲端口」。";
          }

          if (m.errorMsg) {
            var errBox = document.getElementById("pfLiveError");
            if (errBox) errBox.innerHTML = '<div class="banner banner-danger">' + esc(m.errorMsg) + "</div>";
            return;
          }

          var finalName = (m.ssh.name || "").trim() || buildAutoTunnelName(targetHost, targetPort);
          var savedId = m.editSshId;

          if (m.editSshId) {
            var existing = getForwardById(m.editSshId);
            if (existing) {
              existing.name = finalName;
              existing.sshHostId = hostId;
              existing.listenScope = m.ssh.listenScope;
              existing.listenIp = listenIp;
              existing.listenPort = listenPort;
              existing.targetHost = targetHost;
              existing.targetPort = targetPort;
              if (!m.ssh.startNow) {
                existing.state = "stopped";
              }
            }
          } else {
            savedId = nextUid("sf");
            state.sshForwards.push({
              id: savedId,
              name: finalName,
              sshHostId: hostId,
              listenScope: m.ssh.listenScope,
              listenIp: listenIp,
              listenPort: listenPort,
              targetHost: targetHost,
              targetPort: targetPort,
              state: "stopped",
              lastError: ""
            });
          }

          var startAfter = !!m.ssh.startNow;
          modalStack = [];
          renderModal();
          renderApp();
          if (startAfter) {
            toggleTunnelState(savedId);
          } else {
            showToast("已保存 SSH 隧道「" + finalName + "」", "success");
          }
          return;
        }

        // Xray forward save
        var xListenIp = (m.xray.listenIp || "").trim() || "127.0.0.1";
        var xListenPort = Number(m.xray.listenPort);
        var xTargetHost = (m.xray.targetHost || "").trim();
        var xTargetPort = Number(m.xray.targetPort);
        if (!xTargetHost || !xTargetPort || xTargetPort < 1 || xTargetPort > 65535 || !xListenPort || xListenPort < 1 || xListenPort > 65535) {
          m.errorMsg = "请检查 Xray 转发的监听端口与目标地址端口。";
        } else if (findPortConflict(xListenPort, m.editXrayId, "xray")) {
          m.errorMsg = "本机端口 " + xListenPort + " 已被占用。";
        }
        if (m.errorMsg) {
          var xErr = document.getElementById("pfLiveError");
          if (xErr) xErr.innerHTML = '<div class="banner banner-danger">' + esc(m.errorMsg) + "</div>";
          return;
        }
        var xName = (m.xray.name || "").trim() || ("Xray " + xTargetHost + ":" + xTargetPort);
        if (m.editXrayId) {
          for (var i = 0; i < state.xrayForwards.length; i++) {
            if (state.xrayForwards[i].id === m.editXrayId) {
              state.xrayForwards[i].protocol = m.xray.protocol;
              state.xrayForwards[i].listenIp = xListenIp;
              state.xrayForwards[i].listenPort = xListenPort;
              state.xrayForwards[i].targetHost = xTargetHost;
              state.xrayForwards[i].targetPort = xTargetPort;
              state.xrayForwards[i].outboundTag = m.xray.outboundTag;
              state.xrayForwards[i].name = xName;
            }
          }
        } else {
          state.xrayForwards.push({
            id: nextUid("xf"),
            name: xName,
            protocol: m.xray.protocol,
            listenIp: xListenIp,
            listenPort: xListenPort,
            targetHost: xTargetHost,
            targetPort: xTargetPort,
            outboundTag: m.xray.outboundTag
          });
        }
        modalStack = [];
        renderModal();
        renderApp();
        showToast("已保存 Xray 转发「" + xName + "」", "success");
      }

      function saveSshHostModal() {
        var m = modalStack[modalStack.length - 1];
        if (!m || m.type !== "ssh_host") return;
        m.errorMsg = "";

        var parsedAddr = splitHostPort(m.address);
        var cleanHost = parsedAddr.host;
        var port = Number(parsedAddr.port || m.port || 22);
        var hostName = (m.name || "").trim() || cleanHost;
        var credId = m.credentialId;

        if (!cleanHost) {
          m.errorMsg = "请填写 SSH 跳板机服务器地址。";
        } else if (!port || port < 1 || port > 65535) {
          m.errorMsg = "SSH 端口必须在 1 ~ 65535 之间。";
        } else if (m.credMode === "reuse") {
          if (!credId || !getCredById(credId)) {
            m.errorMsg = "请选择已有凭证，或切换到「直接填写新凭证」。";
          }
        } else {
          var ic = m.inlineCred;
          var icUser = (ic.username || parsedAddr.user || "").trim();
          if (!icUser) {
            m.errorMsg = "请填写新凭证的 SSH 账号。";
          } else if (ic.authKind === "password" && !(ic.password || "").trim()) {
            m.errorMsg = "请填写登录密码（或切换到私钥文件模式）。";
          } else if (ic.authKind === "private_key" && !(ic.keyPath || "").trim()) {
            m.errorMsg = "请填写私钥文件路径。";
          } else {
            var newCredId = nextUid("cred");
            var newCredName = (ic.name || "").trim() || buildAutoCredName(icUser, ic.authKind);
            state.sshCredentials.push({
              id: newCredId,
              name: newCredName,
              username: icUser,
              authKind: ic.authKind,
              keyPath: ic.authKind === "private_key" ? ic.keyPath.trim() : "",
              hasPassphrase: ic.authKind === "private_key" && !!(ic.passphrase || "").trim(),
              dpapiEncrypted: true
            });
            credId = newCredId;
          }
        }

        if (m.errorMsg) {
          var errBox = document.getElementById("shErrorBanner");
          if (errBox) errBox.innerHTML = '<div class="banner banner-danger">' + esc(m.errorMsg) + "</div>";
          return;
        }

        var savedHostId = m.editId;
        if (m.editId) {
          var existing = getHostById(m.editId);
          if (existing) {
            existing.name = hostName;
            existing.address = cleanHost;
            existing.port = port;
            existing.credentialId = credId;
            existing.fingerprint = (m.fingerprint || "").trim();
          }
        } else {
          savedHostId = nextUid("host");
          state.sshHosts.push({
            id: savedHostId,
            name: hostName,
            address: cleanHost,
            port: port,
            credentialId: credId,
            fingerprint: (m.fingerprint || "").trim(),
            lastTestStatus: "",
            lastTestMsg: ""
          });
        }

        modalStack.pop();
        if (modalStack.length && modalStack[modalStack.length - 1].type === "port_forward") {
          var pf = modalStack[modalStack.length - 1];
          pf.ssh.sshHostId = savedHostId;
          if (pf.cmdParseResult) {
            pf.cmdParseResult.matchedHost = getHostById(savedHostId);
          }
        }
        renderModal();
        renderApp();
        showToast("已保存跳板机「" + hostName + "」", "success");
      }

      function saveSshCredModal() {
        var m = modalStack[modalStack.length - 1];
        if (!m || m.type !== "ssh_cred") return;
        m.errorMsg = "";
        var user = (m.username || "").trim();
        if (!user) {
          m.errorMsg = "请填写 SSH 账号。";
        } else if (!m.editId && m.authKind === "password" && !(m.password || "").trim()) {
          m.errorMsg = "新建密码凭证时请填写登录密码。";
        } else if (m.authKind === "private_key" && !(m.keyPath || "").trim()) {
          m.errorMsg = "请填写私钥文件路径。";
        }

        if (m.errorMsg) {
          var errBox = document.getElementById("scErrorBanner");
          if (errBox) errBox.innerHTML = '<div class="banner banner-danger">' + esc(m.errorMsg) + "</div>";
          return;
        }

        var credName = (m.name || "").trim() || buildAutoCredName(user, m.authKind);
        if (m.editId) {
          var existing = getCredById(m.editId);
          if (existing) {
            existing.name = credName;
            existing.username = user;
            existing.authKind = m.authKind;
            existing.keyPath = m.authKind === "private_key" ? m.keyPath.trim() : "";
            if (m.authKind === "private_key" && (m.passphrase || "").trim()) {
              existing.hasPassphrase = true;
            } else if (m.authKind === "password") {
              existing.hasPassphrase = false;
            }
          }
        } else {
          state.sshCredentials.push({
            id: nextUid("cred"),
            name: credName,
            username: user,
            authKind: m.authKind,
            keyPath: m.authKind === "private_key" ? m.keyPath.trim() : "",
            hasPassphrase: m.authKind === "private_key" && !!(m.passphrase || "").trim(),
            dpapiEncrypted: true
          });
        }
        modalStack.pop();
        renderModal();
        renderApp();
        showToast("已保存 SSH 凭证「" + credName + "」", "success");
      }

      /* ---------------- Event Wiring ---------------- */
      document.getElementById("scenarioSelect").addEventListener("change", function (e) {
        modalStack = [];
        state = createScenarioData(e.target.value);
        renderModal();
        renderApp();
        showToast("已切换演示场景");
      });

      document.getElementById("themeToggleBtn").addEventListener("click", function () {
        theme = theme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        this.textContent = theme === "light" ? "切换深色" : "切换浅色";
      });

      document.getElementById("resetScenarioBtn").addEventListener("click", function () {
        var cur = document.getElementById("scenarioSelect").value;
        modalStack = [];
        state = createScenarioData(cur);
        renderModal();
        renderApp();
        showToast("已重置当前场景初始数据");
      });

      document.getElementById("highlightsBtn").addEventListener("click", openHighlightsModal);

      document.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) {
          if (e.target.hasAttribute("data-backdrop-close")) {
            closeTopModal();
          }
          return;
        }

        if (btn.hasAttribute("data-modal-close")) {
          closeTopModal();
          return;
        }

        var nav = btn.getAttribute("data-nav");
        if (nav) {
          state.activeNav = nav;
          renderApp();
          return;
        }

        var pm = btn.getAttribute("data-proxy-mode");
        if (pm) {
          state.proxyMode = pm;
          renderApp();
          showToast("代理模式已切换为：" + (pm === "direct" ? "直连" : (pm === "global" ? "全局" : "PAC")));
          return;
        }

        var cfgTab = btn.getAttribute("data-cfg-tab");
        if (cfgTab) {
          state.activeConfigTab = cfgTab;
          renderApp();
          return;
        }

        var subtab = btn.getAttribute("data-fwd-subtab");
        if (subtab) {
          state.activeForwardSubtab = subtab;
          renderApp();
          return;
        }

        var action = btn.getAttribute("data-action");
        if (action === "toggle-core") {
          if (!state.coreRunning && state.brokenXrayJson) {
            showToast("Xray 草稿存在 JSON 语法错误，无法启动 Core；SSH 隧道仍可独立运行", "warn");
            return;
          }
          state.coreRunning = !state.coreRunning;
          renderApp();
          showToast(state.coreRunning ? "Xray Core 已启动" : "Xray Core 已停止（独立 SSH 隧道保持原有状态）");
          return;
        }
        if (action === "restart-core") {
          showToast("已平滑重启 Xray Core（SSH 隧道保持连接不中断）", "success");
          return;
        }
        if (action === "go-config") {
          state.activeNav = "config";
          renderApp();
          return;
        }
        if (action === "go-diag") {
          state.activeNav = "diag";
          renderApp();
          return;
        }
        if (action === "go-forwards") {
          state.activeNav = "config";
          state.activeConfigTab = "forwards";
          state.activeForwardSubtab = "rules";
          renderApp();
          return;
        }
        if (action === "open-new-ssh") {
          openPortForwardModal({ mode: "ssh" });
          return;
        }
        if (action === "open-new-xray") {
          openPortForwardModal({ mode: "xray" });
          return;
        }
        if (action === "start-all-ssh") {
          startAllTunnels();
          return;
        }
        if (action === "stop-all-ssh") {
          stopAllTunnels();
          return;
        }
        if (action === "open-new-host") {
          openSshHostModal();
          return;
        }
        if (action === "open-new-cred") {
          openSshCredModal();
          return;
        }
        if (action === "fix-json-demo") {
          state.brokenXrayJson = false;
          state.coreRunning = true;
          renderApp();
          showToast("已模拟修复 Xray JSON 草稿并恢复 Xray 转发编辑", "success");
          return;
        }

        var copySshId = btn.getAttribute("data-copy-ssh");
        if (copySshId) {
          var copyFwd = getForwardById(copySshId);
          if (copyFwd) {
            var addr = getCopyAddress(copyFwd);
            copyTextToClipboard(addr, "已复制本地连接地址：" + addr);
          }
          return;
        }

        var toggleSshId = btn.getAttribute("data-toggle-ssh");
        if (toggleSshId) {
          toggleTunnelState(toggleSshId);
          return;
        }

        var cloneSshId = btn.getAttribute("data-clone-ssh");
        if (cloneSshId) {
          openPortForwardModal({ mode: "ssh", cloneSshId: cloneSshId });
          return;
        }

        var editSshId = btn.getAttribute("data-edit-ssh");
        if (editSshId) {
          openPortForwardModal({ mode: "ssh", editSshId: editSshId });
          return;
        }

        var delSshId = btn.getAttribute("data-del-ssh");
        if (delSshId) {
          state.sshForwards = state.sshForwards.filter(function (f) { return f.id !== delSshId; });
          renderApp();
          showToast("已删除 SSH 隧道转发规则");
          return;
        }

        var editXrayId = btn.getAttribute("data-edit-xray");
        if (editXrayId) {
          openPortForwardModal({ mode: "xray", editXrayId: editXrayId });
          return;
        }

        var delXrayId = btn.getAttribute("data-del-xray");
        if (delXrayId) {
          state.xrayForwards = state.xrayForwards.filter(function (f) { return f.id !== delXrayId; });
          renderApp();
          showToast("已删除 Xray 端口转发规则");
          return;
        }

        var quickHostId = btn.getAttribute("data-quick-forward-host");
        if (quickHostId) {
          openPortForwardModal({ mode: "ssh", preselectHostId: quickHostId });
          return;
        }

        var testHostId = btn.getAttribute("data-test-host");
        if (testHostId) {
          testHostConnection(testHostId);
          return;
        }

        var editHostId = btn.getAttribute("data-edit-host");
        if (editHostId) {
          openSshHostModal({ editId: editHostId });
          return;
        }

        var delHostId = btn.getAttribute("data-del-host");
        if (delHostId) {
          state.sshHosts = state.sshHosts.filter(function (h) { return h.id !== delHostId; });
          renderApp();
          showToast("已删除 SSH 跳板机");
          return;
        }

        var editCredId = btn.getAttribute("data-edit-cred");
        if (editCredId) {
          openSshCredModal({ editId: editCredId });
          return;
        }

        var delCredId = btn.getAttribute("data-del-cred");
        if (delCredId) {
          state.sshCredentials = state.sshCredentials.filter(function (c) { return c.id !== delCredId; });
          renderApp();
          showToast("已删除 SSH 凭证");
          return;
        }

        /* ----- Inside Modals ----- */
        var top = modalStack[modalStack.length - 1];
        if (!top) return;

        if (top.type === "port_forward") {
          var pfMode = btn.getAttribute("data-pf-mode");
          if (pfMode) {
            top.mode = pfMode;
            top.errorMsg = "";
            renderModal();
            return;
          }
          if (btn.hasAttribute("data-pf-fill-example")) {
            top.cmdText = "ssh -L 15432:10.0.1.8:5432 ops@bastion.corp -p 2222";
            applyParsedSshCommand(top);
            return;
          }
          if (btn.hasAttribute("data-pf-parse-cmd")) {
            applyParsedSshCommand(top);
            return;
          }
          if (btn.hasAttribute("data-pf-create-parsed-host") && top.cmdParseResult) {
            openSshHostModal({
              fromPortForward: true,
              prefillHost: top.cmdParseResult.jumpHost,
              prefillPort: top.cmdParseResult.sshPort,
              prefillUser: top.cmdParseResult.user,
              preferInlineCred: true
            });
            return;
          }
          if (btn.hasAttribute("data-pf-new-host")) {
            openSshHostModal({ fromPortForward: true });
            return;
          }
          var pHost = btn.getAttribute("data-pf-preset-host");
          if (pHost) {
            top.ssh.targetHost = pHost;
            renderModal();
            return;
          }
          var pPort = btn.getAttribute("data-pf-preset-port");
          if (pPort) {
            top.ssh.targetPort = pPort;
            renderModal();
            return;
          }
          var scope = btn.getAttribute("data-pf-scope");
          if (scope) {
            top.ssh.listenScope = scope;
            if (scope === "loopback") top.ssh.listenIp = "127.0.0.1";
            else if (scope === "lan") top.ssh.listenIp = "0.0.0.0";
            else if (isLoopbackIp(top.ssh.listenIp) || top.ssh.listenIp === "0.0.0.0") top.ssh.listenIp = "192.168.1.50";
            renderModal();
            return;
          }
          if (btn.hasAttribute("data-pf-same-port")) {
            if (Number(top.ssh.targetPort) > 0) {
              top.ssh.listenPort = String(top.ssh.targetPort);
              var lpInput = document.getElementById("pfListenPort");
              if (lpInput) lpInput.value = top.ssh.listenPort;
              updatePortForwardLiveHints();
            }
            return;
          }
          var fixPort = btn.getAttribute("data-pf-fix-port");
          if (fixPort) {
            top.ssh.listenPort = fixPort;
            var lpEl = document.getElementById("pfListenPort");
            if (lpEl) lpEl.value = fixPort;
            updatePortForwardLiveHints();
            return;
          }
          var fixXrayPort = btn.getAttribute("data-pf-fix-xray-port");
          if (fixXrayPort) {
            top.xray.listenPort = fixXrayPort;
            var xlpEl = document.getElementById("pfXrayListenPort");
            if (xlpEl) xlpEl.value = fixXrayPort;
            updatePortForwardLiveHints();
            return;
          }
          if (btn.hasAttribute("data-pf-save")) {
            savePortForwardModal();
            return;
          }
        }

        if (top.type === "ssh_host") {
          var shCredMode = btn.getAttribute("data-sh-cred-mode");
          if (shCredMode) {
            top.credMode = shCredMode;
            top.errorMsg = "";
            renderModal();
            return;
          }
          var shInlineAuth = btn.getAttribute("data-sh-inline-auth");
          if (shInlineAuth) {
            top.inlineCred.authKind = shInlineAuth;
            top.errorMsg = "";
            renderModal();
            return;
          }
          if (btn.hasAttribute("data-sh-probe")) {
            if (!(top.address || "").trim()) {
              top.testState = "warn";
              top.testMsg = "请先填写跳板机服务器地址再探测指纹。";
              renderModal();
              return;
            }
            top.probeState = "probing";
            top.testState = "testing";
            top.testMsg = "正在连接跳板机获取主机公钥指纹…";
            renderModal();
            setTimeout(function () {
              var curTop = modalStack[modalStack.length - 1];
              if (!curTop || curTop.type !== "ssh_host") return;
              curTop.probeState = "done";
              curTop.fingerprint = "SHA256:9xQ4kLm2pV7wZ1nC8tB5rY3jH6sD0fG2eA4uN7qP9";
              curTop.testState = "ok";
              curTop.testMsg = "已探测并固定 SHA256 主机指纹，请确认无误后保存。";
              renderModal();
            }, 350);
            return;
          }
          if (btn.hasAttribute("data-sh-test")) {
            top.testState = "testing";
            top.testMsg = "正在模拟 SSH 握手与凭证校验…";
            renderModal();
            setTimeout(function () {
              var curTop = modalStack[modalStack.length - 1];
              if (!curTop || curTop.type !== "ssh_host") return;
              if (!(curTop.address || "").trim()) {
                curTop.testState = "warn";
                curTop.testMsg = "服务器地址不能为空。";
              } else if (!(curTop.fingerprint || "").trim()) {
                curTop.testState = "warn";
                curTop.testMsg = "请先点击「探测指纹」固定服务器 SHA256 指纹后再测试连接。";
              } else if (curTop.credMode === "inline" && !(curTop.inlineCred.username || "").trim()) {
                curTop.testState = "warn";
                curTop.testMsg = "请先填写新凭证的 SSH 账号后再测试连接。";
              } else {
                curTop.testState = "ok";
                curTop.testMsg = "握手与身份校验成功（模拟 RTT 21 ms）。";
              }
              renderModal();
            }, 400);
            return;
          }
          if (btn.hasAttribute("data-sh-save")) {
            saveSshHostModal();
            return;
          }
        }

        if (top.type === "ssh_cred") {
          var scAuth = btn.getAttribute("data-sc-auth");
          if (scAuth) {
            top.authKind = scAuth;
            top.errorMsg = "";
            renderModal();
            return;
          }
          if (btn.hasAttribute("data-sc-save")) {
            saveSshCredModal();
            return;
          }
        }
      });

      function applyParsedSshCommand(m) {
        var res = parseSshLCommand(m.cmdText);
        if (!res.ok) {
          m.cmdError = res.error;
          m.cmdParseResult = null;
          renderModal();
          return;
        }
        m.cmdError = "";
        m.cmdParseResult = res;
        m.ssh.targetHost = res.targetHost;
        m.ssh.targetPort = String(res.targetPort);
        if (res.listenIp === "0.0.0.0") {
          m.ssh.listenScope = "lan";
          m.ssh.listenIp = "0.0.0.0";
        } else if (isLoopbackIp(res.listenIp)) {
          m.ssh.listenScope = "loopback";
          m.ssh.listenIp = "127.0.0.1";
        } else {
          m.ssh.listenScope = "custom";
          m.ssh.listenIp = res.listenIp;
        }
        m.ssh.listenPort = String(res.listenPort);
        if (res.matchedHost) {
          m.ssh.sshHostId = res.matchedHost.id;
        }
        renderModal();
        showToast("已解析 ssh -L 命令并填入表单", "success");
      }

      /* Live input sync WITHOUT full modal innerHTML re-render (preserves focus/caret) */
      document.addEventListener("input", function (e) {
        var top = modalStack[modalStack.length - 1];
        if (!top) return;
        var el = e.target;
        var id = el.id;

        if (top.type === "port_forward") {
          if (id === "pfCmdInput") { top.cmdText = el.value; return; }
          if (id === "pfTargetHost") {
            var sp = splitHostPort(el.value);
            if (sp.port && el.value.indexOf(":") !== -1 && (el.value.indexOf("]") !== -1 || (el.value.match(/:/g) || []).length === 1)) {
              top.ssh.targetHost = sp.host;
              top.ssh.targetPort = String(sp.port);
              el.value = sp.host;
              var tpInput = document.getElementById("pfTargetPort");
              if (tpInput) tpInput.value = String(sp.port);
              showToast("已自动拆分目标地址与端口：" + sp.host + ":" + sp.port);
            } else {
              top.ssh.targetHost = el.value;
            }
            updatePortForwardLiveHints();
            return;
          }
          if (id === "pfTargetPort") { top.ssh.targetPort = el.value; updatePortForwardLiveHints(); return; }
          if (id === "pfListenIp") { top.ssh.listenIp = el.value; updatePortForwardLiveHints(); return; }
          if (id === "pfListenPort") { top.ssh.listenPort = el.value; updatePortForwardLiveHints(); return; }
          if (id === "pfNameInput") { top.ssh.name = el.value; return; }
          if (id === "pfXrayListenIp") { top.xray.listenIp = el.value; return; }
          if (id === "pfXrayListenPort") { top.xray.listenPort = el.value; updatePortForwardLiveHints(); return; }
          if (id === "pfXrayTargetHost") { top.xray.targetHost = el.value; return; }
          if (id === "pfXrayTargetPort") { top.xray.targetPort = el.value; return; }
          if (id === "pfXrayName") { top.xray.name = el.value; return; }
        }

        if (top.type === "ssh_host") {
          if (id === "shAddressInput") { top.address = el.value; updateSshHostLiveHints(); return; }
          if (id === "shPortInput") { top.port = el.value; return; }
          if (id === "shNameInput") { top.name = el.value; return; }
          if (id === "shFpInput") { top.fingerprint = el.value; return; }
          if (id === "shInlineUser") { top.inlineCred.username = el.value; updateSshHostLiveHints(); return; }
          if (id === "shInlineCredName") { top.inlineCred.name = el.value; return; }
          if (id === "shInlinePwd") { top.inlineCred.password = el.value; return; }
          if (id === "shInlineKeyPath") { top.inlineCred.keyPath = el.value; return; }
          if (id === "shInlinePassphrase") { top.inlineCred.passphrase = el.value; return; }
        }

        if (top.type === "ssh_cred") {
          if (id === "scUserInput") {
            top.username = el.value;
            var scNameEl = document.getElementById("scNameInput");
            if (scNameEl) scNameEl.placeholder = "留空自动命名：" + buildAutoCredName(top.username, top.authKind);
            return;
          }
          if (id === "scNameInput") { top.name = el.value; return; }
          if (id === "scPwdInput") { top.password = el.value; return; }
          if (id === "scKeyPathInput") { top.keyPath = el.value; return; }
          if (id === "scPassphraseInput") { top.passphrase = el.value; return; }
        }
      });

      function maybeApplyHostAddrSplit(top, rawValue) {
        var sp = splitHostPort(rawValue);
        if (!sp.user && !sp.port) return false;
        top.address = sp.host;
        var addrEl = document.getElementById("shAddressInput");
        if (addrEl) addrEl.value = sp.host;
        if (sp.port) {
          top.port = String(sp.port);
          var portEl = document.getElementById("shPortInput");
          if (portEl) portEl.value = String(sp.port);
        }
        if (sp.user && top.credMode === "inline") {
          top.inlineCred.username = sp.user;
          var uEl = document.getElementById("shInlineUser");
          if (uEl) uEl.value = sp.user;
        }
        updateSshHostLiveHints();
        showToast("已自动拆分服务器地址" + (sp.port ? "与端口" : "") + (sp.user ? "并填入账号" : ""));
        return true;
      }

      document.addEventListener("paste", function (e) {
        var top = modalStack[modalStack.length - 1];
        if (!top || top.type !== "ssh_host" || e.target.id !== "shAddressInput") return;
        setTimeout(function () {
          maybeApplyHostAddrSplit(top, e.target.value);
        }, 0);
      });

      document.addEventListener("blur", function (e) {
        var top = modalStack[modalStack.length - 1];
        if (!top || top.type !== "ssh_host" || e.target.id !== "shAddressInput") return;
        maybeApplyHostAddrSplit(top, e.target.value);
      }, true);

      document.addEventListener("change", function (e) {
        var top = modalStack[modalStack.length - 1];
        if (!top) return;
        var el = e.target;
        var id = el.id;
        if (top.type === "port_forward") {
          if (id === "pfHostSelect") { top.ssh.sshHostId = el.value; return; }
          if (id === "pfStartNowCheck") {
            top.ssh.startNow = el.checked;
            updatePortForwardLiveHints();
            return;
          }
          if (id === "pfXrayProto") { top.xray.protocol = el.value; return; }
          if (id === "pfXrayOutbound") { top.xray.outboundTag = el.value; return; }
        }
        if (top.type === "ssh_host" && id === "shCredSelect") {
          top.credentialId = el.value;
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modalStack.length) {
          closeTopModal();
        }
      });

      renderApp();
    })();
  </script>
</body>
</html>
