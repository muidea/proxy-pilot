[package]
name = "proxy-manager-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "proxy-pilot"
path = "src/main.rs"

[dependencies]
proxy-model.workspace = true
proxy-supervisor.workspace = true
proxy-config.workspace = true
proxy-pac.workspace = true
proxy-runtime.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
qrcodegen = "1.8"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
rfd = "0.15"
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
winresource = "0.1"
